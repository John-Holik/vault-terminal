<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" />
    <title>Terminal</title>
    <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css" />
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      :root { --neon: #6E79E6; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0E0E11; color: #EDEDEF;
        font-family: system-ui, "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; }

      /* frameless titlebar: drag by the bar, buttons opt out */
      .pbar { -webkit-app-region: drag; position: relative; height: 34px; flex: 0 0 auto; display: flex;
        align-items: center; gap: 8px; padding: 0 4px 0 12px; background: rgba(255,255,255,.02);
        border-bottom: 1px solid rgba(255,255,255,.06); }
      /* status dot: red while running a prompt, green while waiting, gray when exited */
      .pdot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: #3FB950; }
      .pdot.running { background: #F7768E; box-shadow: 0 0 6px rgba(247,118,142,.7); }
      .pdot.waiting { background: #3FB950; box-shadow: 0 0 6px rgba(63,185,80,.55); }
      .pdot.exited { background: #62626C; box-shadow: none; }
      .pname { -webkit-app-region: no-drag; font: 600 12.5px system-ui, "Segoe UI", sans-serif; color: #EDEDEF;
        background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px;
        min-width: 60px; max-width: 320px; outline: none; }
      .pname:hover { background: rgba(255,255,255,.05); }
      .pname:focus { background: rgba(255,255,255,.08); border-color: var(--neon); }
      .pspacer { flex: 1 1 auto; }
      .pctrls { display: flex; gap: 2px; }

      /* theme / neon-color swatch popover */
      .tpop { -webkit-app-region: no-drag; position: absolute; top: 34px; right: 4px; z-index: 60;
        display: none; flex-wrap: wrap; gap: 6px; padding: 8px; max-width: 156px; background: #15151A;
        border: 1px solid rgba(255,255,255,.1); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
      .tpop.open { display: flex; }
      .sw { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
      .sw.on { border-color: #EDEDEF; }

      .tg, .wc { -webkit-app-region: no-drag; background: transparent; border: 0; cursor: pointer;
        border-radius: 6px; display: grid; place-items: center; transition: background .12s, color .12s; }
      .tg { width: 34px; height: 30px; font-size: 13px; color: #9A9AA6; }
      .tg:hover { background: rgba(255,255,255,.06); color: #EDEDEF; }
      .tg.on { color: var(--neon); background: color-mix(in srgb, var(--neon) 16%, transparent); }
      .wc { width: 40px; height: 30px; font-size: 10px; color: #9A9AA6; }
      .wc:hover { background: rgba(255,255,255,.06); color: #EDEDEF; }
      .wc-close:hover { background: #E81123; color: #fff; }

      .tbody { flex: 1 1 auto; min-height: 0; padding: 6px 8px 8px; }
      .tbody .xterm { height: 100%; }

      /* neon glow border around the whole window (mirrors the in-app per-theme neon) */
      body.neon .pbar { border-bottom-color: var(--neon); }
      body.neon::after {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; border-radius: 2px;
        box-shadow: inset 0 0 0 1.5px var(--neon), inset 0 0 18px -4px var(--neon);
      }
    </style>
  </head>
  <body>
    <div class="pbar">
      <span class="pdot"></span>
      <input class="pname" id="pname" spellcheck="false" />
      <span class="pspacer"></span>
      <div class="pctrls">
        <button class="tg" id="btnTheme" title="Theme / neon color"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.2-.64-1.67-.08-.1-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></button>
        <button class="tg" id="btnPin" title="Pinned to group — windows move together (click to unpin)" style="display:none">⛓</button>
        <button class="tg" id="btnTop" title="Always on top (stay above other apps)">📌</button>
        <button class="tg" id="btnLock" title="Lock position (prevent moving)">🔓</button>
        <button class="wc" id="btnMax" title="Fill this monitor with the grid" style="display:none"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx=".6"/><rect x="9" y="2.5" width="4.5" height="4.5" rx=".6"/><rect x="2.5" y="9" width="4.5" height="4.5" rx=".6"/><rect x="9" y="9" width="4.5" height="4.5" rx=".6"/></svg></button>
        <button class="wc" id="btnMin" title="Minimize"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
        <button class="wc wc-close" id="btnClose" title="Dock back into main window"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div class="tpop" id="tpop"></div>
    </div>
    <div class="tbody" id="tbody"></div>

    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <!-- shared terminal theme table: registers window.VT_THEMES before popout.js -->
    <script src="themes.js"></script>
    <script src="popout.js"></script>
  </body>
</html>
